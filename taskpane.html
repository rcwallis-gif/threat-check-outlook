<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Threat Check</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="taskpane.js"></script>
  <link href="https://cdn.tailwindcss.com" rel="stylesheet">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .report { max-height: 420px; overflow-y: auto; }
  </style>
</head>
<body class="bg-gray-50 p-6">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-6">
      <h1 class="text-2xl font-bold flex items-center gap-3">
        <span>🛡️</span> Threat Check
      </h1>
      <p id="status" class="text-blue-100 mt-1">Ready to analyze</p>
    </div>

    <div id="confirm-screen" class="p-6">
      <p class="text-gray-600 mb-4">Submit email for Spam/Phishing Examination?</p>
      <p id="subject-display" class="font-medium text-lg text-gray-800 mb-6"></p>
      
      <div class="flex gap-3">
        <button onclick="cancel()" 
                class="flex-1 py-3 text-gray-700 font-medium border border-gray-300 rounded-xl hover:bg-gray-100">
          Cancel
        </button>
        <button onclick="submitEmail()" 
                class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl">
          Submit to Grok →
        </button>
      </div>
    </div>

    <div id="loading-screen" class="hidden p-6 text-center">
      <div class="animate-spin w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full mx-auto mb-4"></div>
      <p class="text-gray-600">Analyzing with Grok AI...</p>
      <p class="text-xs text-gray-400 mt-2">This usually takes 8-15 seconds</p>
    </div>

    <div id="report-screen" class="hidden p-6">
      <div id="report-content" class="report prose text-sm"></div>
      
      <div id="delete-section" class="hidden mt-6 pt-6 border-t">
        <button onclick="deleteEmail()" 
                class="w-full py-4 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-2xl flex items-center justify-center gap-2">
          🗑️ Delete this message now
        </button>
        <p class="text-xs text-center text-red-500 mt-3">This action cannot be undone</p>
      </div>

      <button onclick="closeTaskpane()" 
              class="w-full mt-4 py-3 text-gray-500 hover:text-gray-700 font-medium">
        Close
      </button>
    </div>
  </div>
</body>
</html>
